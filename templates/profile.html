{% extends "base.html" %}
{% block content %}
<form method="POST">
    <h2>👤 Votre profil</h2>

    <label>Sexe :</label>
    <select name="sex" required>
        <option value="male">Homme</option>
        <option value="female">Femme</option>
    </select>

    <label>Poids actuel (kg) :</label>
    <input type="number" name="weight" step="0.1" required>

    <label>Poids objectif (kg) :</label>
    <input type="number" name="target_weight" step="0.1" required>

    <label>Taille (cm) :</label>
    <input type="number" name="height" required>

    <label>Âge :</label>
    <input type="number" name="age" required>

    <label>Nombre d’entraînements/semaine :</label>
    <input type="number" name="workouts" min="0" max="14" required>

    <label>Durée pour atteindre l’objectif (semaines) :</label>
    <input type="number" name="duration" min="1" required>

    <button type="submit">Enregistrer et voir overview</button>
</form>
{% endblock %}
