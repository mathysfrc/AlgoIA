<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fitness Nutrition Recommender</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Fitness Nutrition Recommender</h1>
        <form method="POST">
            <input type="text" name="food_name" placeholder="Entrez un aliment" value="{{ food_name }}" required>

            <select name="meal_type">
                <option value="">-- Choisir un dinner --</option>
                <option value="Breakfast">Breakfast</option>
                <option value="Lunch">Lunch</option>
                <option value="Dinner">Dinner</option>
                <option value="Snack">Snack</option>
            </select>

            <button type="submit">Recommander</button>
        </form>

        {% if recommendations %}
            <h2>Aliments recommandés :</h2>
            <p>{{ recommendations | join(', ') }}</p>
            {% for graph in graphs %}
                <img src="data:image/png;base64,{{ graph }}" class="graph">
            {% endfor %}
        {% endif %}
    </div>
</body>
</html>
